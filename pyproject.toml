[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-opt-framework"
version = "0.2.0.dev0"
description = "Dimensional optimisation framework for complex beam structures via ANSYS MAPDL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Benito Pezone" }]
dependencies = [
    "ansys-mapdl-core>=0.68",
    "scipy>=1.11",
    "numpy>=1.25",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["beam_opt*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/data"]
markers = [
    "mapdl: integration test that requires a licensed ANSYS MAPDL installation",
    "slow: long optimisation run (tens of seconds); deselect with -m \"not slow\"",
]
